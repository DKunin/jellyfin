<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kunini Discover local preview</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../Jellyfin.Plugin.KuniniDiscover/Web/kunini-discover.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #101010; color: #fff; font: 16px system-ui, sans-serif; }
        .hide { display: none !important; }
        .itemDetailPage { min-height: 100vh; background: radial-gradient(circle at 85% 8%, #754b23 0, transparent 38%); }
        #searchPage { min-height: 100vh; padding-top: 3rem; }
        .previewSearchForm { display: flex; align-items: center; gap: 1.4rem; padding: 0 5%; }
        .previewSearchIcon { color: #c8c8c8; font-size: 3rem; line-height: 1; }
        .previewSearchInput { width: 100%; height: 5rem; padding: 0 1rem; border: .28rem solid #3a3a3a; border-radius: .45rem; outline: none; background: #242424; color: #eee; font: inherit; font-size: 2rem; }
        .noItemsMessage { margin-top: 9rem; color: #bcbcbc; font-size: 1.65rem; text-align: center; }
        .previewHero { min-height: 390px; padding: 72px 6% 36px; background: linear-gradient(90deg, #101010 0%, rgba(16,16,16,.52) 48%, transparent 82%), linear-gradient(180deg, transparent 55%, #101010 100%), url("assets/desert-hero.png") center/cover; }
        .previewHero h1 { margin: 0; font-size: clamp(4rem, 8vw, 7rem); font-weight: 300; letter-spacing: .28em; line-height: .9; }
        .previewHero h1 span,
        .previewHero h1 small { display: block; }
        .previewHero h1 small { margin: .55rem 0 0 1.35em; font-size: .24em; letter-spacing: .62em; }
        .previewMeta { margin: 1rem 0; color: #d5d5d5; }
        .previewCopy { max-width: 560px; color: #ddd; line-height: 1.55; }
        .previewPlay { display: inline-block; margin-top: 1.2rem; padding: .75rem 2rem; border-radius: 999px; background: linear-gradient(100deg,#aa5cc3,#00a4dc); }
        .detailPageSecondaryContainer { padding: 0 0 3rem 6%; }
        .previewSimilar { margin: 0 3.3% 2.75rem 0; }
        .previewSimilar h2 { margin: 0 0 1rem; font-size: 1.75rem; }
        .previewSimilarRail { display: grid; grid-template-columns: repeat(4, minmax(10rem, 14rem)); gap: 1rem; overflow: hidden; }
        .previewSimilarPoster { aspect-ratio: 2 / 3; border-radius: .45rem; background: #202124 url("assets/recommendation-posters.png") calc(var(--preview-column) * 50%) 0 / 300% 200% no-repeat; }
        .previewPosterSprite { width: 300%; max-width: none; height: 200%; object-fit: fill; transform: translate(calc(var(--preview-column) * -33.333333%), calc(var(--preview-row) * -50%)); transform-origin: top left; }
        .kunini-discover-external-poster .kunini-discover-external-poster-image { width: 100%; height: 100%; object-fit: cover; object-position: 48% center; }
        @media (max-width: 50em) {
            .previewHero { min-height: 325px; padding: 32px 1.5rem 28px; }
            .previewHero h1 { font-size: 3rem; }
            .previewHero h1 small { margin-left: .35em; font-size: .32em; }
            .detailPageSecondaryContainer { padding-left: 1.5rem; }
        }
    </style>
    <script>
        window.ApiClient = {
            getUrl: (path, parameters) => parameters ? `${path}?${new URLSearchParams(parameters)}` : path,
            ajax: async ({ url }) => {
                if (url.includes("/KuniniDiscover/details")) {
                    return {
                    sourceId: 4488,
                    mediaType: "Movie",
                    title: "Friday the 13th",
                    originalTitle: null,
                    year: 1980,
                    releaseDate: "1980-05-09",
                    runtimeMinutes: 95,
                    seasonCount: null,
                    certification: "R",
                    rating: 6.4,
                    voteCount: 3201,
                    tagline: "They were warned... They are doomed... And on Friday the 13th, nothing will save them.",
                    overview: "Camp counselors are stalked by an unknown killer while trying to reopen a summer camp with a grim past.",
                    genres: ["Horror", "Mystery", "Thriller"],
                    status: "Released",
                    posterUrl: "/preview/assets/desert-hero.png",
                    backdropUrl: "/preview/assets/desert-hero.png",
                    trailerWatchUrl: "https://www.youtube.com/watch?v=8g18jFHCLXk",
                    trailerEmbedUrl: "https://www.youtube-nocookie.com/embed/8g18jFHCLXk?autoplay=0&playsinline=1&rel=0"
                    };
                }
                const requestUrl = new URL(url, window.location.href);
                const isPerson = requestUrl.searchParams.get("itemId") === "5cf73950d0a972e18f03b2e0c06c463b";
                const requestedPage = Number(requestUrl.searchParams.get("page") || 1);
                const isRecommendation = requestUrl.pathname.endsWith("/KuniniDiscover/recommendations");
                if (isRecommendation && requestedPage > 1) {
                    await new Promise((resolve) => window.setTimeout(resolve, 250));
                }
                return {
                    source: "TMDb",
                    heading: isPerson ? "Movies with Кэри Маллиган" : null,
                    subtitle: isPerson ? "Filmography from TMDb • Not stored on this server" : null,
                    page: requestedPage,
                    hasMore: isRecommendation && !isPerson && requestedPage === 1,
                    items: url.includes("/KuniniDiscover/search")
                        ? [
                            { sourceId: 4488, mediaType: "Movie", title: "Friday the 13th", year: 1980, posterUrl: "/preview/assets/recommendation-posters.png", genre: "Horror", matchPercent: 0 },
                            { sourceId: 9725, mediaType: "Movie", title: "Friday the 13th Part 2", year: 1981, posterUrl: "/preview/assets/recommendation-posters.png", genre: "Horror", matchPercent: 0 },
                            { sourceId: 10225, mediaType: "Movie", title: "Friday the 13th Part VI", year: 1986, posterUrl: "/preview/assets/recommendation-posters.png", genre: "Horror", matchPercent: 0 }
                        ]
                        : isPerson
                        ? [
                            { sourceId: 466420, mediaType: "Movie", title: "Maestro", year: 2023, posterUrl: "/preview/assets/recommendation-posters.png", genre: "as Felicia Montealegre", matchPercent: 0 },
                            { sourceId: 837881, mediaType: "Movie", title: "She Said", year: 2022, posterUrl: "/preview/assets/recommendation-posters.png", genre: "as Megan Twohey", matchPercent: 0 },
                            { sourceId: 582014, mediaType: "Movie", title: "Promising Young Woman", year: 2020, posterUrl: "/preview/assets/recommendation-posters.png", genre: "as Cassandra", matchPercent: 0 }
                        ]
                        : requestedPage > 1
                        ? [
                            { sourceId: 300668, mediaType: "Movie", title: "Annihilation", year: 2018, posterUrl: "/preview/assets/recommendation-posters.png", genre: "Science fiction", matchPercent: 84 },
                            { sourceId: 433808, mediaType: "Movie", title: "The Ritual", year: 2017, posterUrl: "/preview/assets/recommendation-posters.png", genre: "Horror", matchPercent: 81 },
                            { sourceId: 516632, mediaType: "Movie", title: "The Empty Man", year: 2020, posterUrl: "/preview/assets/recommendation-posters.png", genre: "Mystery", matchPercent: 78 }
                        ]
                        : [
                            { sourceId: 438631, mediaType: "Movie", title: "Dune", year: 2021, posterUrl: "/preview/assets/recommendation-posters.png", genre: "Science fiction", matchPercent: 96 },
                            { sourceId: 335984, mediaType: "Movie", title: "Blade Runner 2049", year: 2017, posterUrl: "/preview/assets/recommendation-posters.png", genre: "Science fiction", matchPercent: 93 },
                            { sourceId: 329865, mediaType: "Movie", title: "Arrival", year: 2016, posterUrl: "/preview/assets/recommendation-posters.png", genre: "Drama", matchPercent: 90 },
                            { sourceId: 412656, mediaType: "Movie", title: "Chaos Walking", year: 2021, posterUrl: "/preview/assets/recommendation-posters.png", genre: "Fantasy", matchPercent: 87 }
                        ]
                };
            }
        };
    </script>
</head>
<body>
    <main id="searchPage" class="mainAnimatedPage libraryPage allLibraryPage noSecondaryNavPage hide">
        <div class="previewSearchForm">
            <span class="previewSearchIcon" aria-hidden="true">⌕</span>
            <input class="previewSearchInput" aria-label="Search" value="Friday 13">
        </div>
        <div class="noItemsMessage centerMessage">Sorry! No results found for “Friday 13”</div>
    </main>
    <main class="itemDetailPage">
        <section class="previewHero">
            <h1><span>DUNE</span><small>PART TWO</small></h1>
            <div class="previewMeta">2024 · 2h 46m · PG-13</div>
            <p class="previewCopy">Paul Atreides unites with Chani and the Fremen while seeking revenge against the conspirators who destroyed his family.</p>
            <span class="previewPlay">▶ Play</span>
        </section>
        <div class="detailPageSecondaryContainer">
            <section id="similarCollapsible" class="previewSimilar">
                <h2>More Like This</h2>
                <div class="previewSimilarRail">
                    <div class="previewSimilarPoster" style="--preview-column: 0"></div>
                    <div class="previewSimilarPoster" style="--preview-column: 1"></div>
                    <div class="previewSimilarPoster" style="--preview-column: 2"></div>
                    <div class="previewSimilarPoster" style="--preview-column: 0"></div>
                </div>
            </section>
        </div>
    </main>
    <script>
        const applyPreviewRoute = () => {
            const searching = window.location.hash.toLowerCase().startsWith("#/search");
            document.getElementById("searchPage").classList.toggle("hide", !searching);
            document.querySelector(".itemDetailPage").classList.toggle("hide", searching);
        };
        window.addEventListener("hashchange", applyPreviewRoute);
        applyPreviewRoute();
    </script>
    <script src="../Jellyfin.Plugin.KuniniDiscover/Web/kunini-discover.js"></script>
    <script>
        const applyPreviewPosterSprites = () => {
            document.querySelectorAll(".kunini-discover-image").forEach((image, index) => {
                image.classList.add("previewPosterSprite");
                image.style.setProperty("--preview-column", String(index % 3));
                image.style.setProperty("--preview-row", String(Math.floor(index / 3)));
            });
        };
        new MutationObserver(applyPreviewPosterSprites).observe(document.body, { childList: true, subtree: true });
        applyPreviewPosterSprites();
    </script>
</body>
</html>
