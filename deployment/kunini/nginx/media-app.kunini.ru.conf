server {
    listen 80;
    listen [::]:80;
    server_name media-app.kunini.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/apps/jellyfin/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://media-app.kunini.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name media-app.kunini.ru;

    ssl_certificate /home/dekunin/letsencrypt/live/media-app.kunini.ru/fullchain.pem;
    ssl_certificate_key /home/dekunin/letsencrypt/live/media-app.kunini.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    access_log off;
    client_max_body_size 100m;
    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 3600s;

    location /socket {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host media-app.kunini.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host media-app.kunini.ru;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Kunini-Direct-Access media-app.kunini.ru;
        proxy_set_header X-Auth-User "";
        proxy_set_header X-Auth-User-Id "";
        proxy_set_header X-Auth-Roles "";
        proxy_set_header X-Kunini-Auth-User "";
        proxy_set_header X-Kunini-Auth-User-Id "";
        proxy_set_header X-Kunini-Auth-Roles "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host media-app.kunini.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host media-app.kunini.ru;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Kunini-Direct-Access media-app.kunini.ru;
        proxy_set_header X-Auth-User "";
        proxy_set_header X-Auth-User-Id "";
        proxy_set_header X-Auth-Roles "";
        proxy_set_header X-Kunini-Auth-User "";
        proxy_set_header X-Kunini-Auth-User-Id "";
        proxy_set_header X-Kunini-Auth-Roles "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
