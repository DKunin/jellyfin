map $uri $kunini_jellyfin_accept_encoding {
    default $http_accept_encoding;
    ~^/$ "";
    ~^/web/?$ "";
    ~^/web/index\.html$ "";
}

server {
    listen 80;
    listen [::]:80;
    server_name media.kunini.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/apps/jellyfin/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name media.kunini.ru;

    ssl_certificate /home/dekunin/letsencrypt/live/media.kunini.ru/fullchain.pem;
    ssl_certificate_key /home/dekunin/letsencrypt/live/media.kunini.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    access_log off;
    client_max_body_size 100m;
    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 3600s;

    location = /_kunini_auth_verify {
        internal;
        proxy_pass http://127.0.0.1:3030/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header X-Auth-User "";
        proxy_set_header X-Auth-User-Id "";
        proxy_set_header X-Auth-Roles "";
        proxy_set_header X-Kunini-Auth-User "";
        proxy_set_header X-Kunini-Auth-User-Id "";
        proxy_set_header X-Kunini-Auth-Roles "";
    }

    location @kunini_login {
        return 302 https://auth.kunini.ru/login?return_to=https://$host$request_uri;
    }

    location /socket {
        auth_request /_kunini_auth_verify;
        error_page 401 = @kunini_login;
        auth_request_set $kunini_user $upstream_http_x_auth_user;
        auth_request_set $kunini_user_id $upstream_http_x_auth_user_id;
        auth_request_set $kunini_roles $upstream_http_x_auth_roles;

        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host media.kunini.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Cookie "";
        proxy_set_header X-Auth-User "";
        proxy_set_header X-Auth-User-Id "";
        proxy_set_header X-Auth-Roles "";
        proxy_set_header X-Kunini-Auth-User $kunini_user;
        proxy_set_header X-Kunini-Auth-User-Id $kunini_user_id;
        proxy_set_header X-Kunini-Auth-Roles $kunini_roles;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        auth_request /_kunini_auth_verify;
        error_page 401 = @kunini_login;
        auth_request_set $kunini_user $upstream_http_x_auth_user;
        auth_request_set $kunini_user_id $upstream_http_x_auth_user_id;
        auth_request_set $kunini_roles $upstream_http_x_auth_roles;

        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host media.kunini.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Cookie "";
        proxy_set_header X-Auth-User "";
        proxy_set_header X-Auth-User-Id "";
        proxy_set_header X-Auth-Roles "";
        proxy_set_header X-Kunini-Auth-User $kunini_user;
        proxy_set_header X-Kunini-Auth-User-Id $kunini_user_id;
        proxy_set_header X-Kunini-Auth-Roles $kunini_roles;
        proxy_set_header Accept-Encoding $kunini_jellyfin_accept_encoding;
        sub_filter_once on;
        sub_filter '</head>' '<style id="kunini-auth-guard">html{visibility:hidden}</style><script src="/KuniniAuth/script.js?v=3" defer></script></head>';
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
